<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg,skyblue,purple);
        }
        form{
            height: 80%;
            border-radius: 10px;
            width: 30%;
            background-color: white;
        }
        .email,.password,.login{
            height: 22.5%;
            /* border: 1px solid black; */
            width: 90%;
            margin: auto;
        }
        input{
            text-align: center;
            border: 1px solid gray;
            background-color: lightgray;
            border-radius: 10px;
            height: 40%;
            width: 100%;
            margin-top: 3%;
        }
        h1,.email,.password,.login{
           /* margin-top: 3%;
             */
        }
        h1{
            margin-top: 10%;
            margin-bottom: 5%;
        }
        .login>p{
            margin-top: 5%;
            text-align: center;
        }
        .password>p{
            margin-top: 3%;
            color: gray;
            font-style: italic;
        }
        #Login{
            background: linear-gradient(90deg,skyblue,purple);
            color: white;
        }
        a{
            text-decoration: none;
            font-style: italic;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">Login Form</h1>
        <div class="email"><label for="">Email or Phone</label>
        <input type="text" placeholder="xyzgmail.com">
    </div>
    <div class="password"><label for="">Password</label>
        <input type="password" placeholder="Abc@1234">
        <p>Forget Pasword</p>
    </div>
    <div class="login">
        <input type="button" value="Login" id="Login">
        <p>Not a member ? <a href="singup.html">Sign Up</a></p>
    </div>
    </form>
</body>
</html>
